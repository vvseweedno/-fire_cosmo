[project]
name = "wildfire-nexus-core"
version = "1.0.0"
description = "Хакатонный сервис ДЗЗ: поиск очагов горения и картирование гарей"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web & API
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    
    # Geo & Raster (Critical for Hackathon)
    "rasterio>=1.3.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "numpy>=1.26.0",
    "pystac-client>=0.7.0",
    
    # Data Ingestion
    "httpx>=0.26.0",
    "aiohttp>=3.9.0",
    
    # Utils
    "python-multipart>=0.0.6",
    "jinja2>=3.1.0",
    "apscheduler>=3.10.0",
    "loguru>=0.7.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "geojson>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing -v"
