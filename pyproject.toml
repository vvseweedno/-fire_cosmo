[project]
name = "wildfire-nexus-core"
version = "0.1.0"
description = "Wildfire detection and tracking core system (48h sprint)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "httpx>=0.26.0",
    "apscheduler>=3.10.0",
    "aiogram>=3.5.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "geojson>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "httpx>=0.26.0", # Для TestClient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"] # Линтер сам справится, но иногда длинные URL

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"] # Разрешить assert в тестах

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/nexus --cov-report=term-missing --cov-fail-under=80 -v"
