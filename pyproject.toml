[project]
name = "cosmohack-ready-prototype"
version = "0.1.0"
description = "Competition-first AF and burn-severity prototype for CosmoHackathon 2026"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "rasterio>=1.3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wildfire", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=wildfire --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
