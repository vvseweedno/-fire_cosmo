name: CI

on:
  push:
    branches:
      - ready-prototype
      - ready-prototype-final-v2
      - competition-final-proven
      - competition-max-accuracy-v2
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q wildfire app scripts inference.py train.py tests
      - name: Tests
        run: pytest
      - name: API smoke
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          client = TestClient(app)
          assert client.get("/health").json()["status"] == "ok"
          assert client.get("/api/spec").status_code == 200
          PY
      - name: Docker build
        run: docker build -t ready-prototype:ci .
