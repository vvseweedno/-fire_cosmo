name: CI

on:
  push:
    branches:
      - hackathon-winning-two-stage-pipeline
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q app
      - name: Tests
        env:
          OFFLINE_MODE: 'true'
        run: pytest -q
